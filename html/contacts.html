<!DOCTYPE html>

<html>

    <head>

        <title> Martin James Gamilla </title>

        <!-- Link to Free Icons Website https://fontawesome.com/ -->
        <link href="../fontawesome/css/all.min.css" rel = "stylesheet"/>

        <!-- Link CSS File for base css design-->
        <link rel= "stylesheet" type = "text/css" href = "../css/base.css">

        <!-- Link CSS File for contact css design-->
        <link rel= "stylesheet" type = "text/css" href = "../css/contact.css">

        <!-- Link to Inter and Exo 2 Fonts via Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <body>

        <div class = "toggle_dark_mode">

            <i class="fa-regular fa-moon fa-xl toggle_icon"></i>

        </div>


        <div class = "main_body_container">

            <div class = "main_body">


                <div class = "main_home_container">

                    <div class = "main_title_container">

                        <p class = "title head"> Contact </p>

                        <div class = "return_container" onclick = "window.location.href = `../index.html`">

                            <i class="fa-solid fa-arrow-left fa-lg return_icon" style = "color: white;"></i>

                        </div>

                    </div>


                    <div class = "main_content_container">

                        <div class = "main_content_contact_container">

                            <p class = "title contact_me toggle_white"> Contact Me </p>
                            <p class = "title contact_desc toggle_lightblue"> Would like to hear from you! </p>

                        </div>

                        <div class = "email_me_container"> 

                            
                            <p class = "content email_me toggle_white"> Email me at: 
                                <span class = " email toggle_lightblue tooltip"> mrtnjgamilla@gmail.com <span class = "tooltip_text"> Copy to clipboard </span> </span> 
                            </p>

                            <p class = "content email_me_desc_button toggle_white"> Click the button below to send me an email! </p>

                            <a href = "mailto:mrtnjgamilla@gmail.com" class = "email_link">
                                <button class = "button_link toggle_white " > <i class="fa-solid fa-envelope fa-lg"></i> Email Me </button>
                            </a>


                        </div>


                    </div>


                    <p class = "title other_methods toggle_white"> Other Contact Methods </p>

                    <div class = "main_links_container">

                        <div class = "link_container" onclick = "window.open(`https://www.facebook.com/martinjames.gamilla/`, `_blank`)">

                                <i class = "fa-brands fa-facebook fa-lg link_icon"></i>
                                <p class = "link_title toggle_lightblue"> Facebook </p>

                        </div>

                        <div class = "link_container" onclick = "window.open(`https://github.com/DiamondYeah`, `_blank`)">

                                <i class = "fa-brands fa-github fa-lg link_icon"></i>
                                <p class = "link_title toggle_lightblue"> Github </p>

                        </div>

                        <div class = "link_container" onclick = "window.open(`https://discord.com/users/461822280712847361`, `_blank`)">

                                <i class = "fa-brands fa-discord fa-lg link_icon"></i>
                                <p class = "link_title toggle_lightblue"> Discord </p>

                        </div>

                    </div>


                </div>

            </div>

        </div>

        <footer>

            <div class = "footer_container">

                <div class = "icon_links_container">

                    <i class = "fa-brands fa-facebook fa-sm link_icon" onclick = "window.open(`https://www.facebook.com/martinjames.gamilla/`, `_blank`)"></i>
                    <i class = "fa-brands fa-github fa-sm link_icon" onclick = "window.open(`https://github.com/DiamondYeah`, `_blank`)"></i>
                    
                </div>

                <p class = "content copyright toggle_white"> © 2026 Martin James Gamilla </p>

            </div>
