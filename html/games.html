<!DOCTYPE html>

<html>

    <head>

        <title> Martin James Gamilla </title>

        <!-- Link to Free Icons Website https://fontawesome.com/ -->
        <link href="../fontawesome/css/all.min.css" rel = "stylesheet"/>

        <!-- Link CSS File for base css design-->
        <link rel= "stylesheet" type = "text/css" href = "../css/base.css">

        <!-- Link to Inter and Exo 2 Fonts via Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">



        <!-- Link JS equivalent of TS File for darkmode interaction -->
        <script type = "module" src = "../js/darkmode.js"></script>

        <!-- Link JS equivalent of TS File for sound toggle interaction -->
        <script type = "module" src = "../js/soundtoggle.js"></script>

    </head>

    <body>

        <div class = "toggle_dark_mode">

            <i class="fa-solid fa-moon fa-xl toggle_icon"></i>

        </div>

        <div class = "toggle_sound_mode">

            <i class="fa-solid fa-volume fa-xl toggle_icon"></i>
            
        </div>


        <div class = "main_body_container">

            <div class = "main_body">

                <div class = "main_title_container">

                    <p class = "title head"> Games </p>

                    <div class = "return_container" onclick = "window.location.href = `../index.html`">

                        <i class="fa-solid fa-arrow-left fa-lg return_icon" style = "color: white;"></i>

                    </div>

                </div>
            

                <div class = "main_error_container">


                    <i class="fa-solid fa-hammer fa-xl normal_icon"></i>


                    <div class = "error_content_container">

                        <p class = "content error toggle_darkblue">Under Construction!</p>
                        <p class = "content description toggle_white">This page is currently a work in progress! Check back later to see if it's up!</p>
                        <p class = "content error toggle_darkblue">:&#41;</p>

                    </div>
                    

                </div>


                    
            </div>

        </div>


        <footer>

            <div class = "footer_container">

                <div class = "icon_links_container">

                    <i class = "fa-brands fa-facebook fa-sm link_icon contact_link" onclick = "window.open(`https://www.facebook.com/martinjames.gamilla/`, `_blank`)"></i>
                    <i class = "fa-brands fa-github fa-sm link_icon contact_link" onclick = "window.open(`https://github.com/DiamondYeah`, `_blank`)"></i>
                    
                </div>

                <div class = "footer_content_container">

                    <p class = "content copyright toggle_white"> © 2026 Martin James Gamilla </p>
                    <p class = "content attribution toggle_white"> All sound effects are found in 
                        <a class = "attribution_link contact_link toggle_lightblue" href = "https://www.zapsplat.com/" target = "_blank" >Zapsplat.com</a>
                    </p>

                </div>



            </div>


        </footer>




    </body>



</html>
